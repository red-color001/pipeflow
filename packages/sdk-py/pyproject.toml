[project]
name = "pipeflow-agent"
version = "0.1.0"
description = "Agent SDK for the pipeflow live topology visualizer."
requires-python = ">=3.9"
dependencies = ["requests>=2.31", "psutil>=5.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeflow_agent*"]
