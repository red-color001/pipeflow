x-agent-base: &agent-base
  build:
    context: .
    dockerfile: agents/Dockerfile
  image: pipline-data-flow-agent
  depends_on:
    - server
  restart: unless-stopped
  environment: &agent-env
    PIPEFLOW_BACKEND: http://server:4000
    PIPEFLOW_TOKEN:   ${AGENT_TOKEN:-dev-token-change-me}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-pipeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeflow}
      POSTGRES_DB:       ${POSTGRES_DB:-pipeflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipeflow}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-pipeflow}:${POSTGRES_PASSWORD:-pipeflow}@postgres:5432/${POSTGRES_DB:-pipeflow}
      AGENT_TOKEN: ${AGENT_TOKEN:-dev-token-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

