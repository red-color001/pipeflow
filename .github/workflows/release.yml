name: release-agent-binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runs-on: ubuntu-latest
            artifact_name: pipeflow-agent-linux-x64
            binary_ext: ''
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
            artifact_name: pipeflow-agent-linux-arm64
            binary_ext: ''
          - target: windows-x64
            runs-on: windows-latest
            artifact_name: pipeflow-agent-windows-x64.exe
            binary_ext: '.exe'
          - target: macos-arm64
            runs-on: macos-14
            artifact_name: pipeflow-agent-macos-arm64
            binary_ext: ''
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install ./packages/sdk-py

      - name: Build binary
        working-directory: agents
        run: pyinstaller pyinstaller.spec --noconfirm

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p out
          cp "agents/dist/pipeflow-agent${{ matrix.binary_ext }}" "out/${{ matrix.artifact_name }}"

      - name: Generate sha256
        shell: bash
        run: |
          cd out
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
