<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Pipeline Data Flow v4 — Editable Topology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#040711;
    --bg2:#070b18;
    --ink:#e2e8f0;
    --ink-dim:#94a3b8;
    --line:#1e293b;
    --acc:#818cf8;
  }
  *{box-sizing:border-box}
  html,body,#root{height:100%;margin:0}
  body{
    background:radial-gradient(1200px 800px at 20% 0%, #0c1428 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:"Geist", ui-sans-serif, system-ui, sans-serif;
    overflow:hidden;
  }
  .app{display:flex;flex-direction:column;height:100%}
  .hdr{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 22px;border-bottom:1px solid var(--line);
    background:rgba(7,11,24,0.7);backdrop-filter:blur(8px);
    z-index:5;
  }
  .title{display:flex;align-items:center;gap:12px}
  .title .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--acc);box-shadow:0 0 12px var(--acc);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .title h1{margin:0;font-size:16px;font-weight:600;letter-spacing:0.01em}
  .title .sub{color:var(--ink-dim);font-weight:400}
  .meta{display:flex;align-items:center;gap:18px;font-size:12px;color:var(--ink-dim);font-family:"JetBrains Mono",monospace}
  .meta .kv b{color:var(--ink);font-weight:600;margin-right:4px}
  .kvOn{display:flex;align-items:center;gap:6px;color:#34d399}
  .kvOff{display:flex;align-items:center;gap:6px;color:#94a3b8}
  .live{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399;animation:pulse 1.4s ease-in-out infinite}
  .dead{width:7px;height:7px;border-radius:50%;background:#64748b}

  .stage{flex:1;position:relative;overflow:hidden}

  /* Playback controls */
  .playctl{
    position:absolute;left:50%;top:14px;transform:translateX(-50%);
    display:flex;align-items:center;gap:6px;
    background:rgba(7,11,24,0.92);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:10px;
    padding:5px;z-index:4;
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
    font-family:"JetBrains Mono",monospace;
  }
  .playctl .pc{
    display:flex;align-items:center;gap:6px;
    padding:6px 12px;font-size:11.5px;font-weight:600;
    background:transparent;border:1px solid transparent;border-radius:6px;
    color:var(--ink-dim);cursor:pointer;font-family:inherit;
    letter-spacing:0.04em;
  }
  .playctl .pc:hover{background:rgba(255,255,255,0.05);color:var(--ink)}
  .playctl .pc.on{background:rgba(52,211,153,0.12);color:#34d399;border-color:rgba(52,211,153,0.35)}
  .playctl .pc.off{background:rgba(248,113,113,0.10);color:#f87171;border-color:rgba(248,113,113,0.3)}
  .playctl .pcdiv{width:1px;height:18px;background:var(--line);margin:0 2px}

  /* Zoom controls */
  .zoomctl{
    position:absolute;right:18px;bottom:18px;
    display:flex;flex-direction:column;align-items:stretch;gap:4px;
    background:rgba(7,11,24,0.88);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:10px;
    padding:6px;z-index:4;
    font-family:"JetBrains Mono",monospace;
  }
  .zoomctl button{
    width:32px;height:30px;
    background:none;border:1px solid transparent;border-radius:6px;
    color:var(--ink);font:inherit;font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .zoomctl button:hover{background:rgba(255,255,255,0.06);border-color:var(--line)}
  .zoomctl .z{
    text-align:center;font-size:10px;color:var(--ink-dim);
    padding:2px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  }

  .panhint{
    position:absolute;left:18px;bottom:56px;
    font-size:10.5px;color:var(--ink-dim);
    font-family:"JetBrains Mono",monospace;
    background:rgba(7,11,24,0.78);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:6px;
    padding:6px 10px;z-index:4;
    pointer-events:none;letter-spacing:0.04em;
    max-width:60vw;
  }
  .panhint kbd{
    background:rgba(255,255,255,0.05);border:1px solid var(--line);
    border-radius:3px;padding:1px 5px;margin:0 3px;font-size:9.5px;color:var(--ink);
  }

  .legend{
    position:absolute;left:0;right:0;bottom:0;
    display:flex;align-items:center;gap:6px;
    padding:8px 22px;
    background:rgba(4,7,17,0.88);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    font-size:11px;font-family:"JetBrains Mono",monospace;
    z-index:3;overflow-x:auto;white-space:nowrap;
  }
  .legendHd{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;
    color:var(--ink-dim);margin-right:6px;font-weight:600;flex:none}
  .legendRow{
    display:inline-flex;align-items:center;gap:6px;padding:3px 9px;
    background:rgba(255,255,255,0.025);border:1px solid var(--line);
    color:var(--ink);
    border-radius:999px;font:inherit;white-space:nowrap;flex:none;
  }
  .swatch{width:9px;height:9px;border-radius:50%;flex:none;
    box-shadow:0 0 8px currentColor}

  /* Push panhint above legend strip */
  .legend ~ .panhint, .stage .legend{}
  .stage{padding-bottom:0}

  /* tweaks-panel font */
  .twk-panel{font-family:"Geist",sans-serif !important}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data-v4.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="diagram-v4.jsx"></script>
</body>
</html>
